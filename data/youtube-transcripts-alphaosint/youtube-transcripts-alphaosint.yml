name: YouTube Transcripts (AlphaOSINT)
description: Hosted MCP server that returns timestamped transcripts and
  subtitles for YouTube videos and Shorts as JSON, for up to 100 URLs per call
  or a channel's recent uploads, with optional translation and video metadata.
  Runs on Apify's MCP endpoint with Apify OAuth or an API token; billed per
  video on the user's Apify account.
