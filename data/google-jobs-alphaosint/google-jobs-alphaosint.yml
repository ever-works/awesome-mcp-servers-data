name: Google Jobs (AlphaOSINT)
description: Hosted MCP server that searches Google Jobs postings by keyword and
  location across Google's country domains and returns structured JSON rows with
  title, company, location, posting age, apply links and the full description.
  Runs on Apify's MCP endpoint with Apify OAuth or an API token; billed per page
  of results on the user's Apify account.
