name: Cueston
description: Hosted MCP server for Cueston in-app guidance. Lets an assistant
  build, preview and publish product tours, tooltips, banners, onboarding
  checklists, surveys and announcements on your own SaaS app, and read their
  analytics. 76 tools and 5 prompts. Streamable HTTP with OAuth 2.1; also runs
  locally via npx.
