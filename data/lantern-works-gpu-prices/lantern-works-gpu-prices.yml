markdown: |-
  ## Overview

  Lantern Works GPU Prices is a free, read-only MCP server for GPU cloud rental
  prices, price changes and deals. It compares H100, H200, A100, L40S, RTX
  4090/5090 and more across tracked providers, cheapest first, with each price's
  vendor source and check time, price history and GPU job cost estimates. No API
  key or account is needed.

  ## Connect

  - **Hosted (Streamable HTTP, no auth):** `https://lantern-works-mcp.lantern-works.workers.dev/mcp`
  - **Local stdio:** `uvx lantern-works-deals-mcp` (PyPI package `lantern-works-deals-mcp`)

  ## Links

  - Source: https://github.com/connormatthewdouglas/agent-work-stack-deals
  - Website: https://thelanternworks.com/?ref=everworks

